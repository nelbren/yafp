name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bash-quality:
    name: Bash quality on Linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install linters
        run: bash scripts/unix/setup/quality.bash
      - name: Run Unix checks
        env:
          YAFP_REQUIRE_LINTERS: 1
        run: bash scripts/unix/quality/check.bash

  bash-macos:
    name: Bash tests on macOS
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Run Unix checks
        run: bash scripts/unix/quality/check.bash

  powershell-windows:
    name: PowerShell quality on Windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install linters
        shell: pwsh
        run: >-
          pwsh -NoProfile -File scripts/windows/setup/quality.ps1
          -PackageManager choco
      - name: Run Windows checks
        shell: pwsh
        env:
          YAFP_REQUIRE_LINTERS: 1
        run: pwsh -NoProfile -File scripts/windows/quality/check.ps1
